#!/usr/sbin/nft -f
# Example nftables ruleset for the on-prem host that terminates the IPsec tunnel (strongSwan) and/or runs the
# MCP server. All addresses are EXAMPLES: replace them with your own.
#
# !!! BEFORE YOU APPLY THIS FILE: set ADMIN_NET below to the address you administer this host from.
# !!! The input policy is DROP and SSH is allowed only from ADMIN_NET. With the example value you will lock
# !!! yourself out of SSH the moment the ruleset loads (and the lab VM is then only reachable from the console).
#
# Goals
#   1. Accept IKE (UDP 500), NAT-T (UDP 4500) and ESP only from the GreenNode VPN public IP.
#   2. Accept the MCP port (TCP 8080/8443) to the MCP host only from the customer VPC CIDR and from the
#      AgentBase VPC 172.30.0.0/16, and only when the packet really came out of the tunnel.
#   3. Drop everything else addressed to this host.
#   4. Clamp the TCP MSS so that ESP overhead does not create MTU black holes inside the tunnel.
#
# Whether the MCP Gateway source address reaches the data center as 172.30.0.0/16 or is source-NATed to a
# VPC address is not stated in the GreenNode docs: both ranges are allowed here; verify with GreenNode, then
# remove the range you do not need.
#
# The ruleset lives in its own table (inet onprem_mcp) and never touches other tables, so Docker, ufw or libvirt
# keep working. Do NOT add `flush ruleset`: it would delete their tables too.
#
# Apply:   sudo nft -c -f firewall/nftables.conf     (syntax and kernel check, changes nothing)
#          sudo nft -f firewall/nftables.conf        (safe to repeat: the table is replaced atomically)
# Persist: copy to /etc/nftables.conf and `sudo systemctl enable --now nftables`
# Remove:  sudo nft delete table inet onprem_mcp
#
# Topologies covered by the same rules:
#   - MCP server on THIS host (native process, input chain) or in Docker published on this host
#     (Docker DNAT sends the packets through the forward chain, matched through `ct original`).
#   - strongSwan on a dedicated gateway box forwarding to a separate MCP host (forward chain).
#     In that case set the forward chain policy to drop and add rules for your other legitimate flows.
#
# IPv6: the tunnel and every rule below are IPv4 only. The table is `inet`, so IPv6 traffic reaching this host is
# dropped by the input policy except what IPv6 needs to work at all (ICMPv6 and DHCPv6 replies). IPv6 is not
# forwarded by default; if you enable it, add `ip6` rules to the forward chain.

define GN_VPN_IP       = 203.0.113.10        # GreenNode VPN public IP (example)
define VPC_CIDR        = 10.20.0.0/16        # customer VPC CIDR (example)
define AGENTBASE_CIDR  = 172.30.0.0/16       # AgentBase VPC (managed by GreenNode)
define ONPREM_CIDR     = 192.168.0.0/16      # data-center LAN (example)
define MCP_HOST        = 192.168.10.20       # internal IP of the MCP server / Caddy (example)
define MCP_PORTS       = { 8080, 8443 }      # keep only the port you actually expose
define ADMIN_NET       = 198.51.100.0/24     # !!! SET THIS to the network or IP you SSH from, BEFORE applying !!!
define MSS             = 1360                # TCP MSS inside the tunnel (1500 MTU minus ESP overhead, with margin)

# Re-load idiom for every nftables version: declaring the table makes the delete succeed on the first load,
# and the delete makes the definition below replace an older copy. (`destroy table` does this in one line but is a
# syntax error on older releases such as nftables 1.0.2 of Ubuntu 22.04.) The file is one atomic transaction.
table inet onprem_mcp
delete table inet onprem_mcp

table inet onprem_mcp {

    # TCP MSS clamping runs at mangle priority, BEFORE the filter chains. It must come first: the SYN-ACK of a
    # connection is already `established` and would be accepted before a clamp rule placed after that accept.
    chain mss_forward {
        type filter hook forward priority mangle; policy accept;
        tcp flags & (syn | rst) == syn tcp option maxseg size set $MSS
    }

    # MCP server on this host (all-in-one topology). The server's own replies leave through `output`, and its
    # send size is derived from the MSS of the peer's SYN, which arrives through `input`: clamp both directions
    # for traffic to and from the tunnel ranges.
    chain mss_output {
        type filter hook output priority mangle; policy accept;
        ip daddr { $VPC_CIDR, $AGENTBASE_CIDR } tcp flags & (syn | rst) == syn tcp option maxseg size set $MSS
    }

    chain mss_input {
        type filter hook input priority mangle; policy accept;
        ip saddr { $VPC_CIDR, $AGENTBASE_CIDR } tcp flags & (syn | rst) == syn tcp option maxseg size set $MSS
    }

    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif "lo" accept

        # IPv6 stops working without neighbour discovery; DHCPv6 replies for a host that gets its address that way
        meta l4proto ipv6-icmp accept
        ip6 daddr fe80::/10 udp dport 546 accept

        # IPsec control and data plane, only from the GreenNode VPN gateway
        ip saddr $GN_VPN_IP udp dport { 500, 4500 } accept
        ip saddr $GN_VPN_IP ip protocol esp accept

        # MCP server running directly on this host: only decapsulated tunnel traffic from the allowed ranges
        ip saddr { $VPC_CIDR, $AGENTBASE_CIDR } meta ipsec exists ip daddr $MCP_HOST tcp dport $MCP_PORTS accept
        ip saddr { $VPC_CIDR, $AGENTBASE_CIDR } meta ipsec exists icmp type echo-request accept

        # Administration. ADMIN_NET (top of this file) MUST be your own address or you lock yourself out.
        ip saddr $ADMIN_NET tcp dport 22 accept

        # Everything else is dropped by the policy; log a few for troubleshooting
        limit rate 5/minute log prefix "nft-input-drop " counter
    }

    chain forward {
        # Policy accept so that Docker and other forwarding on this host keep working.
        # On a dedicated gateway box change it to `policy drop`.
        type filter hook forward priority filter; policy accept;

        ct state established,related accept

        # MCP port (`ct original` sees the pre-DNAT destination, so this also works for Docker-published ports):
        # allowed only from the VPC / AgentBase ranges AND only if it arrived through the tunnel
        ip saddr { $VPC_CIDR, $AGENTBASE_CIDR } meta ipsec exists ct original ip daddr $MCP_HOST meta l4proto tcp ct original proto-dst $MCP_PORTS accept
        ip saddr { $VPC_CIDR, $AGENTBASE_CIDR } meta ipsec exists ip daddr $MCP_HOST icmp type echo-request accept

        # Everyone else is denied access to the MCP port, and the tunnel may not reach the rest of the LAN
        ct original ip daddr $MCP_HOST meta l4proto tcp ct original proto-dst $MCP_PORTS drop
        ip saddr { $VPC_CIDR, $AGENTBASE_CIDR } ip daddr $ONPREM_CIDR drop
    }
}
