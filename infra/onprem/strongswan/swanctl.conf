# strongSwan swanctl.conf: IKEv2 site-to-site tunnel from the customer data center to the
# GreenNode VPN Site-to-Site gateway.
#
# Install as /etc/swanctl/swanctl.conf, then:  sudo swanctl --load-all
# Every address below is an EXAMPLE. Replace them with your own values (see ../README.md).
#
#   GreenNode VPN public IP (Remote Gateway)  203.0.113.10   (shown on the VPN detail page; example)
#   On-prem gateway public IP                 198.51.100.20  (the value you typed as "Remote Public Gateway IP"; example)
#   On-prem LAN (GreenNode "Remote Private CIDR") 192.168.0.0/16 (example)
#   Customer VPC CIDR (GreenNode local CIDR)  10.20.0.0/16   (example)
#   AgentBase VPC (managed by GreenNode)      172.30.0.0/16
#
# Algorithms: chosen from the "Support IPSEC Configuration" page of the GreenNode VPN docs and the
# pfSense interoperability demo. Both ends MUST agree. If the VPN detail page in the console shows
# different IKE / IPsec policy values, adjust `proposals` and `esp_proposals` to match it.

connections {
    greennode-vpn {
        version = 2                          # IKEv2 (as in the GreenNode demo)

        local_addrs  = 198.51.100.20         # address of this host/gateway that terminates the tunnel
        remote_addrs = 203.0.113.10          # GreenNode VPN public IP

        # IKE (phase 1). Order = preference. All entries use algorithms from the GreenNode supported list:
        #   aes256gcm128 (AEAD, default) / aes256 (CBC), sha2_256 (default hash, used as PRF for GCM), modp3072 / modp2048 (default).
        # The first entry is what the GreenNode demo used (AES256-GCM, 128-bit ICV, SHA-256, DH 3072).
        proposals = aes256gcm128-prfsha256-modp3072, aes256gcm128-prfsha256-modp2048, aes256-sha256-modp3072, aes256-sha256-modp2048

        # Dead Peer Detection: probe every 30 s, tear down and re-initiate when the peer stops answering.
        dpd_delay = 30s
        # IKE SA lifetime of the GreenNode demo (4 hours). IKEv2 peers rekey independently,
        # so the two sides do not need identical values.
        rekey_time = 4h
        keyingtries = 0                      # keep retrying forever
        unique = replace
        fragmentation = yes
        mobike = no                          # fixed public IPs on both sides

        local {
            auth = psk
            id = 198.51.100.20               # must equal the "Remote Public Gateway IP" entered in the GreenNode console
        }
        remote {
            auth = psk
            id = 203.0.113.10
        }

        # If this strongSwan host is behind a NAT device that owns the public IP, use its PRIVATE address in
        # local_addrs, keep `id` = the public IP, and open UDP 500/4500 on the NAT device. Public IP
        # requirements of the GreenNode console: see the VPN connect conditions (verify with GreenNode for NAT cases).

        children {
            greennode-vpc {
                # Traffic selectors. local_ts = the on-prem LAN (GreenNode "Remote Private CIDR").
                # remote_ts = the customer VPC CIDR that GreenNode uses as its local CIDR, plus the AgentBase VPC
                # 172.30.0.0/16 so replies to the MCP Gateway are also routed into the tunnel. The GreenNode docs only
                # describe the VPC CIDR as the tunnel's local network: if GreenNode narrows the selectors to the VPC CIDR,
                # strongSwan accepts the narrowed set. Whether 172.30.0.0/16 is carried as-is or source-NATed to the VPC
                # range is unconfirmed: verify with GreenNode.
                local_ts  = 192.168.0.0/16
                remote_ts = 10.20.0.0/16, 172.30.0.0/16

                # IPsec / ESP (phase 2). The GreenNode demo used AES256 + SHA-256 for phase 2; AES-256-GCM is the
                # default in the supported list. PFS is not described in the docs: verify with GreenNode.
                esp_proposals = aes256gcm128-modp3072, aes256gcm128, aes256-sha256-modp3072, aes256-sha256

                mode = tunnel
                rekey_time = 16h             # CHILD SA lifetime of the GreenNode demo
                dpd_action = restart         # re-establish the CHILD SA if DPD declares the peer dead
                close_action = restart
                start_action = start         # bring the tunnel up when the configuration is loaded
            }
        }
    }
}

# The pre-shared key lives in a separate file that is never committed (see ../README.md):
#   /etc/swanctl/conf.d/greennode.secrets.conf  (copy of greennode.secrets.conf.example, chmod 600)
include conf.d/*.conf
